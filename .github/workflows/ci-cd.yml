name: Credit Card Default scoring CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      run_full_pipeline:
        description: 'Запустить полный pipeline'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.13.5'
  DATA_PATH: 'data/raw/UCI_Credit_Card.csv'
  GITHUB_DATASET_URL: 'https://github.com/learn2pr0ge/credit-card-clients/releases/download/v1.0-data/UCI_Credit_Card.csv'

jobs:
  # Проверка качества кода flake8/black/isort
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.3.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v4.2.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Code formatting check (Black)
      run: black --check --diff .

    - name: Import sorting check (isort)
      run: isort --check-only --diff .

    - name: Linting (flake8)
      run: flake8 . --count --show-source --statistics

  # Запуск тестов
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [code-quality, data-validation]
    steps:
    - uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.3.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v4.2.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create logs directory
      run: mkdir -p logs

    - name: Run unit tests
      run: |
        pytest tests -v --cov=src --cov-report=xml --cov-report=html

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4.0.1
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  # Проверка данных через Great Expectations
  data-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: code-quality
    steps:
    - uses: actions/checkout@v4.2.2

    - name: Set up Python
      uses: actions/setup-python@v5.3.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v4.2.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download dataset from GitHub Releases
      run: |
        mkdir -p data/raw
        curl -L -o data/raw/UCI_Credit_Card.csv \
          "${{ env.GITHUB_DATASET_URL }}"

    - name: Prepare data (make_dataset)
      run: python src/data/make_dataset.py

    - name: Build features (build_features)
      run: python src/features/build_features.py

    - name: Data validation Great Expectations
      run: python src/data/validation.py

  # Запуск полного pipeline обучения модели
  train_model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4.2.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset from GitHub Releases
        run: |
          mkdir -p data/raw
          curl -L -o data/raw/UCI_Credit_Card.csv \
            "${{ env.GITHUB_DATASET_URL }}"
        continue-on-error: true

      - name: Data versioning with DVC
        run: |
          dvc pull

      - name: Run DVC pipeline
        run: |
          dvc repro

      - name: Full pipeline
        run: |
          python src/run_pipeline.py
