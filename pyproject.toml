[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "credit_scoring_model"
version = "0.0.1"
description = "\u0423\u0447\u0435\u0431\u043d\u044b\u0439 \u043f\u0440\u043e\u0435\u043a\u0442 \u043f\u043e \u0434\u0438\u0441\u0446\u0438\u043f\u043b\u0438\u043d\u0435 MLOps"
authors = [
  { name = "Egor_N" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.10.0"

[tool.black]
line-length = 99
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | csm_venv
  | test_env_local
  | mlruns
  | catboost_info
  | htmlcov
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["credit_scoring_model"]
force_sort_within_sections = true


